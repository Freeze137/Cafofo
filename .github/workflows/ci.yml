# Pipeline de integração contínua do Cafofo Adoção (Parte 2 — Qualidade de Software).
# Executa em cada push e pull request. Um job que falha bloqueia o merge
# quando a proteção da branch main exige estas verificações.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend - testes, cobertura e auditoria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  frontend:
    name: Frontend - lint, build e auditoria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
